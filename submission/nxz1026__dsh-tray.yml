description:
  en: 'Windows system-tray launcher for DeepSeek Harness Web: start, stop, restart, open the Web UI, tail logs, live status icon, launch-at-login toggle, and a remote (cloud over SSH tunnel) mode.'
  zh: 'DeepSeek Harness Web 的 Windows 托盘启动器：托盘图标一键启动、停止、重启服务，打开 Web UI、查看日志，实时状态图标，支持开机自启，并可通过 SSH 隧道直连云端主机。'
